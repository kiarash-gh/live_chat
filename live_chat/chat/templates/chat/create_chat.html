{% extends 'base.html' %}
{% block content %}
<h2>Create Chat</h2>

<form method="post">
  {% csrf_token %}
  <label>Chat Type:</label><br>
  <input type="radio" name="chat_type" value="private" checked onchange="toggleUserSelect()"> Private<br>
  <input type="radio" name="chat_type" value="group" onchange="toggleUserSelect()"> Group<br><br>

  <div id="group-name-field" style="display: none;">
    <label>Group Name:</label>
    <input type="text" name="name">
    <br><br>
  </div>

  <div>
    <label>Select User(s):</label><br>
    {% for user in users %}
      <div>
        <input type="checkbox" name="users" value="{{ user.id }}" class="user-select"> {{ user.username }}
      </div>
    {% endfor %}
  </div>

  <br>
  <button type="submit">Create Chat</button>
</form>

<script>
function toggleUserSelect() {
  const chatType = document.querySelector('input[name="chat_type"]:checked').value;
  const checkboxes = document.querySelectorAll('.user-select');
  const groupNameField = document.getElementById('group-name-field');

  if (chatType === 'private') {
    groupNameField.style.display = 'none';
    checkboxes.forEach(cb => {
      cb.type = 'radio';
      cb.name = 'users';  // radio buttons must have same name
    });
  } else {
    groupNameField.style.display = 'block';
    checkboxes.forEach(cb => {
      cb.type = 'checkbox';
      cb.name = 'users';
    });
  }
}
window.onload = toggleUserSelect;
</script>
{% endblock %}
