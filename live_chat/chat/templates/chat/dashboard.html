{% extends 'base.html' %}
{% block content %}
<h2>Your Chats</h2>
<ul>
  {% for chatroom in chatrooms %}
    <li>
      <a href="{% url 'chatroom_detail' chat_id=chatroom.id %}">
        {{ chatroom.display_name }}
      </a>
    </li>
  {% empty %}
    <li>No chats yet.</li>
  {% endfor %}
</ul>

<a href="{% url 'create_chat' %}">+ Create New Chat</a>
{% endblock %}
