{% extends 'base.html' %}
{% block content %}
<h2>Your Chats</h2>
<ul>
  {% for chat in chatrooms %}
    <li>
      <a href="{% url 'chatroom_detail' chat.id %}">
        {{ chat.name|default:"Chat #"|add:chat.id }} ({{ chat.chat_type }})
      </a>
    </li>
  {% empty %}
    <li>No chats yet.</li>
  {% endfor %}
</ul>

<a href="{% url 'create_chat' %}">+ Create New Chat</a>
{% endblock %}
