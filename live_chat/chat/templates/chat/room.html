<h2>Chat Room</h2>
<p>Welcome, {{ username }} | <a href="/logout/">Logout</a></p>

<div id="chat-log">
  {% for message in messages %}
    <p><b>{{ message.sender.username }}</b>: {{ message.content }}</p>
  {% endfor %}
</div>

<input id="chat-message-input" placeholder="Type message..." />
<button id="chat-message-submit">Send</button>

<script>
  const socket = new WebSocket('ws://' + window.location.host + '/ws/chat/');

  socket.onmessage = function (e) {
    const data = JSON.parse(e.data);
    document.getElementById('chat-log').innerHTML += `<p><b>${data.username}</b>: ${data.message}</p>`;
  };

  document.getElementById('chat-message-submit').onclick = function () {
    const message = document.getElementById('chat-message-input').value;
    socket.send(JSON.stringify({ message }));
    document.getElementById('chat-message-input').value = '';
  };
</script>
